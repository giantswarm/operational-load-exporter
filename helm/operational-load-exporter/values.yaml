image:
  registry: gsoci.azurecr.io
  name: giantswarm/operational-load-exporter
  # Defaults to the chart's appVersion.
  tag: ""

cortex:
  url: ""
  username: ""
  password: ""

github:
  # -- Legacy personal access token (already base64, written straight into the
  # Secret's `data:`). Used only when the GitHub App values below are not all set.
  key: ""
  # GitHub App credentials. Preferred over `key` when all three are set.
  app:
    # @schema type:[string, integer]
    # -- The App ID. Accepts a string or a number.
    id: ""
    # @schema type:[string, integer]
    # -- The installation ID of the App on the giantswarm organization. Accepts a string or a number.
    installationID: ""
    # -- The App private key, PEM text (not base64; the chart encodes it).
    privateKey: ""

incidentio:
  key: ""

resources:
  main:
    requests:
      cpu: 2m
      memory: 20Mi
    limits:
      cpu: 50m
      memory: 200Mi
  grafanaAgent:
    requests:
      cpu: 8m
      memory: 50Mi
    limits:
      cpu: 50m
      memory: 200Mi
