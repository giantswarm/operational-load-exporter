apiVersion: v1
kind: Secret
metadata:
  name: operational-load-exporter
  namespace: operational-load-exporter
type: Opaque
data:
  {{- if .Values.github.key }}
  GITHUB_KEY: {{ .Values.github.key }}
  {{- end }}
  {{- with .Values.github.app }}
  {{- if .id }}
  GITHUB_APP_ID: {{ .id | toString | b64enc }}
  {{- end }}
  {{- if .installationID }}
  GITHUB_APP_INSTALLATION_ID: {{ .installationID | toString | b64enc }}
  {{- end }}
  {{- if .privateKey }}
  GITHUB_APP_PRIVATE_KEY: {{ .privateKey | b64enc }}
  {{- end }}
  {{- end }}
  INCIDENT_IO_KEY: {{ .Values.incidentio.key }}
